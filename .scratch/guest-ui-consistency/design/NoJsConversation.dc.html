<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation without JavaScript</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="sl {{theme}}" style="width: 390px; height: 844px">
<header class="topbar"><span class="brand">Shortlet</span><span class="grow"></span><a class="textbtn" href="#"><i class="ic ic-message" aria-hidden="true"></i>New conversation</a></header>
<ol class="rail" aria-label="Booking progress"><li class="done">Search</li><li class="done">Stay</li><li class="now">Request</li><li>Offer</li><li>Pay</li><li>Confirmed</li></ol>
<main class="transcript">
<p class="me">Book the Old Ikoyi apartment</p>
<p class="who">Concierge</p>
<p class="bot">Your request is ready to review. Your dates are not reserved yet.</p>
<a class="result" href="#"><span class="thumb"><i class="ic ic-doc" aria-hidden="true"></i></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t">Review your request</span><span class="p">₦370,000 <span>all-in · 10–13 Sept</span></span></span><i class="ic ic-chevron" aria-hidden="true"></i></a>
<p class="marker">Draft created</p>
</main>
<form class="composer"><input class="field" type="text" placeholder="Area, dates, guests" aria-label="Your message"><button class="btn" type="submit" style="min-block-size: 48px">Send</button></form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
