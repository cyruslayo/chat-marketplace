<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Error page</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="sl {{theme}}" style="width: 390px; height: 844px">
<header class="topbar"><a class="iconbtn" href="#" aria-label="Back to your conversation"><i class="ic ic-left" aria-hidden="true"></i></a><span class="brand">Shortlet</span><span class="grow"></span></header>
<main class="main" style="justify-content: center">
<section class="empty"><span class="art"><i class="ic ic-alert" aria-hidden="true"></i></span><h1 class="h1" style="font-size: 26px">This search link isn’t valid</h1><p class="small">The link is incomplete or has been changed. Return to the conversation and search again.</p><a class="btn block" href="#">Back to your conversation</a></section>
<p class="meta" style="text-align: center">Error code SEARCH_INVALID</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
